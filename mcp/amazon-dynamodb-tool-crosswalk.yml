mcp_only:
- tool: dynamodb_data_modeling
  reason: Design guidance. Returns a modeling prompt; no API operation backs it.
- tool: dynamodb_data_model_validation
  reason: Drives DynamoDB Local (a local JAR) to create tables and replay access patterns. It exercises
    CreateTable/PutItem/Query semantics, but against the local emulator, not the service, so it binds
    to no account-facing operation.
- tool: source_db_analyzer
  reason: Reads a MySQL/PostgreSQL/SQL Server/Oracle source schema. Not a DynamoDB surface at all.
- tool: generate_resources
  reason: Emits a CDK app. Deployment happens later through CloudFormation, not through the DynamoDB API.
- tool: dynamodb_data_model_schema_converter
  reason: File-to-file transformation of the data model into schema.json.
- tool: dynamodb_data_model_schema_validator
  reason: Static validation of schema.json.
- tool: generate_data_access_layer
  reason: Generates Python that WILL call boto3 DynamoDB operations; the tool itself calls none.
- tool: compute_performances_and_costs
  reason: Cost arithmetic over the access patterns. Reads the price list model, not the API.
- tool: aws___get_presigned_url
  reason: Amazon S3 surface, used for file hand-off around run_script.
- tool: aws___get_tasks
  reason: Server-side task bookkeeping for long-running run_script invocations.
- tool: aws___list_regions
  reason: AWS-wide metadata.
- tool: aws___get_regional_availability
  reason: AWS-wide metadata.
- tool: aws___retrieve_skill
  reason: Returns AWS-authored agent skills; not a DynamoDB operation.
