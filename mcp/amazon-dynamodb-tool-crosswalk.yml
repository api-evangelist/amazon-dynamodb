note: 'DynamoDB''s MCP surface does not mirror its API surface, and the crosswalk is lopsided on purpose.
  The eight tools of the first-party awslabs.dynamodb-mcp-server are DESIGN tools - none of them binds
  to a DynamoDB operation at all, so they are recorded in mcp_only[] with the reason. The runtime binding
  is a single generic executor, aws___run_script, which fans out to every operation in the model. Fifty-eight
  REST operations therefore have no named tool. Nothing here is mapped by guesswork: a tool is bound to
  an operation only where the tool''s own published description names that work.'
