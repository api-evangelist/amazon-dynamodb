  tool_count: 5
  tools_file: amazon-dynamodb-aws-knowledge-mcp-tools-list.json
  tools: [aws___read_documentation, aws___search_documentation, aws___list_regions, aws___get_regional_availability, aws___retrieve_skill]
  covers_dynamodb: documentation-only
  coverage_note: Read-only AWS documentation search and fetch. Returns the DynamoDB developer guide and API reference; cannot call the API.
authentication:
  runtime: AWS SigV4 (IAM)
  read_only_switch: DDB-MCP-READONLY environment variable on the stdio server
  note: >-
    The stdio server honours a DDB-MCP-READONLY flag, which is a real agent-safety
    control worth knowing about: the vendor's own install snippets set it true.
