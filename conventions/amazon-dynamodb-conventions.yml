  artifact: lifecycle/amazon-dynamodb-lifecycle.yml
dry_run_mode:
  supported: false
  note: >-
    There is no dry-run or validate-only flag on any operation. The nearest
    rehearsal surfaces are DynamoDB Local (run the whole workload against a local
    emulator) and a ConditionExpression that is guaranteed to fail, which tells
    you whether the condition holds without mutating. Both are workarounds, not a
    published dry-run.
reversibility:
  grade: verified
  note: >-
    DynamoDB splits cleanly in two, and an agent needs to know which half it is
    in. Control-plane destruction is reversible with a stated window. Data-plane
    destruction is not reversible at all - there is no undo for an item write or
    delete, and that is the case an autonomous agent is most likely to reach.
  write_surfaces:
    - operation: DeleteTable
      reversal: RestoreTableFromBackup
      reversal_operation_id: RestoreTableFromBackup
      window: >-
        35 days, IF point-in-time recovery was enabled on the table before the
        delete: DynamoDB automatically writes a system backup named
        {table}$DeletedTableBackup at delete time and retains it for 35 days at
        no charge.
      precondition: PITR enabled before deletion, or an on-demand backup taken beforehand
      docs: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/PointInTimeRecovery_Howitworks.html
      grade: verified
    - operation: 'PutItem / UpdateItem / DeleteItem / BatchWriteItem / TransactWriteItems (item-level writes)'
      reversal: point-in-time restore of the WHOLE table to a new table name
      reversal_operation_id: RestoreTableToPointInTime
      window: >-
        the configured PITR recovery period, settable per table between 1 and 35
        days, with a floor of about five minutes before now
        (LatestRestorableDateTime) - and only when PITR was already on.
      caveat: >-
        This is not an undo. RestoreTableToPointInTime always restores to a NEW
        table; it cannot roll one item back in place, and the application must
        then be repointed or the data copied. If PITR is off, a wrong write is
        permanent.
      docs: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/PointInTimeRecovery.Tutorial.html
      grade: verified
    - operation: UpdateTable (capacity, indexes, class)
      reversal: a further UpdateTable
      window: >-
        rate-limited rather than time-limited: capacity DECREASES are capped at
        27 per table per UTC day, and capacity-mode switches at 4 per 24 hours.
        An agent can therefore make a change it cannot immediately take back.
      grade: documented
    - operation: DeleteBackup
      reversal: none
      window: null
      grade: none
      note: Deleting a backup is permanent and removes the reversal path for everything above it.
  na: false
