note: >-
  Every entry is first-party AWS. DynamoDB is a service client inside the AWS SDK
  family, so the pattern is: a dedicated dynamodb package where AWS ships one
  (JS, Ruby, .NET, Java, Go, Rust) and the umbrella SDK where it does not
  (Python/boto3, PHP). There is no abandonment signal anywhere in this surface -
  every package below was published within the last ten days except the Maven
  artifact, which tracks the same release train. The one entry that is NOT an
  SDK is the MCP server, listed here because it is how an agent installs the
  DynamoDB tool surface.
