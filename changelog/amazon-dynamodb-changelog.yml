  - date: '2025-03-26'
    title: AWS PrivateLink support for DynamoDB Streams
    type: addition
    breaking: false
  - date: '2025-01-07'
    title: Configurable point-in-time recovery period
    type: addition
    breaking: false
    highlights:
      - PITR window now settable per table between 1 and 35 days
    docs: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Point-in-time-recovery.html
