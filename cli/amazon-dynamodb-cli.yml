      - update-global-table-settings
      streams-integration:
      - describe-kinesis-streaming-destination
      - disable-kinesis-streaming-destination
      - enable-kinesis-streaming-destination
      - update-kinesis-streaming-destination
      governance:
      - delete-resource-policy
