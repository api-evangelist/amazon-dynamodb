      - restore-table-from-backup
      - restore-table-to-point-in-time
      - update-global-table
      - update-global-table-settings
      - update-table
      items:
      - batch-execute-statement
      - batch-get-item
      - batch-write-item
      - delete-item
      - execute-statement
      - execute-transaction
      - get-item
      - put-item
      - query
      - scan
      - search-vectors
