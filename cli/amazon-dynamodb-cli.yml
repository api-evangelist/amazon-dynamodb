      - list-backups
      - restore-table-from-backup
      - restore-table-to-point-in-time
      - update-continuous-backups
      import-export:
      - describe-export
      - describe-import
      - export-table-to-point-in-time
      - import-table
      - list-exports
      - list-imports
      global-tables:
      - create-global-table
