  dynamodbstreams:
    count: 4
    commands:
    - describe-stream
    - get-records
    - get-shard-iterator
    - list-streams
key_flows:
- name: Create a table and wait for it
  commands:
  - aws dynamodb create-table --table-name X --attribute-definitions ... --key-schema ... --billing-mode
    PAY_PER_REQUEST
  - aws dynamodb wait table-exists --table-name X
- name: Run against DynamoDB Local
  commands:
  - docker run -p 8000:8000 amazon/dynamodb-local
  - aws dynamodb list-tables --endpoint-url http://localhost:8000
- name: Read an item as JSON rather than AttributeValue shapes
  commands:
  - aws dynamodb get-item --table-name X --key '{"pk":{"S":"1"}}'
  - aws dynamodb execute-statement --statement "SELECT * FROM X WHERE pk='1'"
- name: Point-in-time restore
  commands:
  - aws dynamodb update-continuous-backups --table-name X --point-in-time-recovery-specification PointInTimeRecoveryEnabled=true
  - aws dynamodb restore-table-to-point-in-time --source-table-name X --target-table-name X-restored --restore-date-time
    <ts>
wait_verbs:
- table-exists
- table-not-exists
