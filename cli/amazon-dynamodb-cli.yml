  (read 2026-09-18); command surface reconciled against smithy/dynamodb-2012-08-10.json, which is the
  model the CLI is generated from. Version read from github.com/aws/aws-cli tags.
note: 'The AWS CLI is not a hand-written DynamoDB CLI - it is generated from the same first-party model
  this repo now carries in smithy/, so the command surface and the API surface are one-to-one by construction:
  58 dynamodb subcommands and 4 dynamodbstreams subcommands, named as the kebab-case of each operation.
  Two conveniences exist only in the CLI and are worth knowing: `aws dynamodb wait` blocks on table-exists/table-not-exists,
  and `--endpoint-url http://localhost:8000` points the whole surface at DynamoDB Local.'
name: AWS CLI
binary: aws
namespaces:
- aws dynamodb
- aws dynamodbstreams
- aws dax
version:
  major: v2
  latest: 2.36.48
  source: https://github.com/aws/aws-cli/tags (read 2026-09-18)
  v1:
    package: awscli
    registry: pypi
    version: 1.46.1
    published: '2026-08-27'
    note: v1 is still published but v2 is the current line; v2 is distributed as a signed installer/container,
      not a PyPI package.
install:
- platform: macos
  command: brew install awscli
- platform: macos
  command: curl 'https://awscli.amazonaws.com/AWSCLIV2.pkg' -o AWSCLIV2.pkg && sudo installer -pkg AWSCLIV2.pkg
    -target /
- platform: linux
  command: curl 'https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip' -o awscliv2.zip && unzip awscliv2.zip
    && sudo ./aws/install
- platform: windows
  command: msiexec.exe /i https://awscliv2.amazonaws.com/AWSCLIV2.msi
- platform: docker
  command: docker run --rm -it amazon/aws-cli dynamodb list-tables
auth:
  style: aws-sigv4
  configure: aws configure | aws configure sso | AWS_PROFILE / AWS_REGION environment variables
  note: Same IAM credentials as the SDKs; the CLI has no separate token.
commands:
  dynamodb:
    count: 58
    groups:
      tables:
      - create-global-table
      - create-table
